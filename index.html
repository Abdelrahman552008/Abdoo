<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171c22" />
    <meta name="description" content="حارة آخر زمن — محاكاة حياة اجتماعية في حارة مصرية خلال التسعينيات." />
    <title>حارة آخر زمن</title>
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">ح</span><div><strong>حارة آخر زمن</strong><small>القاهرة · صيف ١٩٩٦</small></div></div>
        <div class="clock"><span class="live-dot"></span><span id="game-time">اليوم الأول · ٨:٠٠ صباحًا</span></div>
      </header>
      <section class="game-shell" aria-label="عالم اللعبة">
        <div id="game"></div>
        <div class="location-tag">📍 ميدان الحارة</div>
        <div class="hint">استخدم الأسهم أو WASD للحركة</div>
      </section>
      <footer class="bottom-bar">
        <div class="player-info"><span class="avatar">👤</span><div><strong>أنت</strong><small>بداية حكايتك</small></div></div>
        <div class="stats"><span>❤️ ١٠٠</span><span>⚡ ١٠٠</span><span>💵 ٥٠ ج</span></div>
        <div class="touch-pad" aria-label="أزرار الحركة">
          <button data-step="up" aria-label="تحرك لأعلى">▲</button>
          <div><button data-step="left" aria-label="تحرك لليسار">◀</button><button data-step="down" aria-label="تحرك لأسفل">▼</button><button data-step="right" aria-label="تحرك لليمين">▶</button></div>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
